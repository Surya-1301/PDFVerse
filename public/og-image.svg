<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b29"/>
      <stop offset="55%" stop-color="#2e2742"/>
      <stop offset="100%" stop-color="#1e1b29"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow -->
  <circle cx="940" cy="140" r="420" fill="url(#glow)"/>
  <circle cx="180" cy="520" r="320" fill="url(#glow)"/>

  <!-- Subtle grid dots -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="80" cy="80" r="3"/><circle cx="160" cy="80" r="3"/>
    <circle cx="240" cy="80" r="3"/><circle cx="320" cy="80" r="3"/>
    <circle cx="80" cy="160" r="3"/><circle cx="160" cy="160" r="3"/>
    <circle cx="240" cy="160" r="3"/><circle cx="320" cy="160" r="3"/>
    <circle cx="880" cy="480" r="3"/><circle cx="960" cy="480" r="3"/>
    <circle cx="1040" cy="480" r="3"/><circle cx="1120" cy="480" r="3"/>
    <circle cx="880" cy="560" r="3"/><circle cx="960" cy="560" r="3"/>
    <circle cx="1040" cy="560" r="3"/><circle cx="1120" cy="560" r="3"/>
  </g>

  <!-- PDF Document Card (centerpiece) -->
  <g filter="url(#shadow)">
    <rect x="470" y="115" width="260" height="320" rx="16" fill="#ffffff"/>
    <!-- File header strip -->
    <rect x="470" y="115" width="260" height="52" rx="16" fill="url(#accent)"/>
    <rect x="470" y="143" width="260" height="24" fill="url(#accent)"/>
    <!-- Title lines -->
    <rect x="498" y="196" width="150" height="14" rx="7" fill="#d4d4d8"/>
    <rect x="498" y="224" width="204" height="14" rx="7" fill="#e4e4e7"/>
    <rect x="498" y="252" width="174" height="14" rx="7" fill="#e4e4e7"/>
    <!-- Divider -->
    <rect x="498" y="286" width="204" height="2" rx="1" fill="#f4f4f5"/>
    <!-- Table rows -->
    <rect x="498" y="308" width="120" height="10" rx="5" fill="#e4e4e7"/>
    <rect x="498" y="332" width="98" height="10" rx="5" fill="#e4e4e7"/>
    <rect x="498" y="356" width="140" height="10" rx="5" fill="#e4e4e7"/>
    <!-- Tools row -->
    <g>
      <rect x="498" y="392" width="30" height="22" rx="6" fill="#f3e8ff"/>
      <rect x="538" y="392" width="30" height="22" rx="6" fill="#f3e8ff"/>
      <rect x="578" y="392" width="30" height="22" rx="6" fill="#f3e8ff"/>
      <rect x="618" y="392" width="30" height="22" rx="6" fill="#f3e8ff"/>
    </g>
    <!-- Sparkles overlay -->
    <path d="M600 150 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Floating mini cards -->
  <g filter="url(#shadow)">
    <!-- Merge badge (left) -->
    <rect x="230" y="120" width="180" height="64" rx="14" fill="#ffffff"/>
    <rect x="252" y="142" width="26" height="26" rx="8" fill="#8b5cf6" fill-opacity="0.15"/>
    <rect x="252" y="149" width="14" height="12" rx="3" fill="#8b5cf6"/>
    <text x="292" y="152" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#27272a">Merge PDF</text>
    <text x="292" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a1a1aa">Combine files online</text>
  </g>

  <g filter="url(#shadow)">
    <!-- Sign badge (right) -->
    <rect x="790" y="430" width="180" height="64" rx="14" fill="#ffffff"/>
    <rect x="812" y="452" width="26" height="26" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <path d="M820 466 l8 6 12 -14" stroke="#10b981" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="852" y="462" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#27272a">Sign PDF</text>
    <text x="852" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a1a1aa">E-sign in browser</text>
  </g>

  <!-- Headline -->
  <text x="600" y="540" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">
    PDFVerse
  </text>
  <text x="600" y="580" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#c4b5fd">
    Free PDF Editor &amp; 40+ Tools — in your browser
  </text>

  <!-- Site URL tag -->
  <rect x="465" y="596" width="270" height="34" rx="17" fill="#ffffff" fill-opacity="0.08"/>
  <text x="600" y="618" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e4e4e7">
    pdfverse.pages.dev
  </text>
</svg>